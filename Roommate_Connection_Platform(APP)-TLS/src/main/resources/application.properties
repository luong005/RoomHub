spring.application.name=Roommate_Connection_Platform

spring.config.import=optional:file:.env[.properties]
server.port = 8083

spring.datasource.url = jdbc:mysql://localhost:3306/roommate connection platform
spring.datasource.username = root
spring.datasource.password = ${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto = validate
logging.level.org.springframework.security=DEBUG

spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.enable_lazy_load_no_trans = true

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

api.prefix = api

# Login counters are local to this backend process; security events are stored in MySQL.
app.security.login.max-failures=5
app.security.login.failure-window-seconds=300
app.security.login.block-duration-seconds=300
app.security.login.ip-max-requests=20
app.security.login.ip-window-seconds=300
jwt.expiration = 2592000
jwt.secretKey = ${JWT_SECRET_KEY}

cloudinary.cloud-name=${your_cloud_name}
cloudinary.api-key=${your_api_key}
cloudinary.api-secret=${your_api_secret}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
